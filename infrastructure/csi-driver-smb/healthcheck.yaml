apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: smb-healthcheck
  namespace: default
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  volumeName: pv-smb-share-healthcheck
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: smb-healthcheck
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: smb-healthcheck
  template:
    metadata:
      labels:
        app: smb-healthcheck
    spec:
      containers:
        - name: smb-healthcheck
          image: python:3.12-alpine
          command: ["python3", "/app/healthcheck.py"]
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: script
              mountPath: /app
            - name: smb
              mountPath: /mnt/smb
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            periodSeconds: 10
      volumes:
        - name: script
          configMap:
            name: smb-healthcheck-script
        - name: smb
          persistentVolumeClaim:
            claimName: smb-healthcheck
---
apiVersion: v1
kind: Service
metadata:
  name: smb-healthcheck
  namespace: default
spec:
  selector:
    app: smb-healthcheck
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: smb-healthcheck
  namespace: default
spec:
  entryPoints:
    - web
  routes:
    - kind: Rule
      match: Host(`smb-healthcheck.k8s.tstuessi.com`)
      services:
        - name: smb-healthcheck
          port: 80
