apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fullstack-example
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://forgejo.k8s.tstuessi.com/tstuessi/fullstack-example.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
